name: KineRouter CI

# Gate every change under kine/ on vet + test + a real binary build. Each job is
# path-filtered so edits to npm/ do not pay for a full Go rebuild.

on:
  push:
    branches: [main]
    paths:
      - "kine/**"
      - ".github/workflows/kine-ci.yml"
  pull_request:
    paths:
      - "kine/**"
      - ".github/workflows/kine-ci.yml"
  workflow_dispatch:

concurrency:
  group: kine-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: kine

env:
  GO_VERSION: "1.27.4"
  NODE_VERSION: "24"

jobs:
  go:
    name: Go vet + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: kine/go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l ./cmd ./internal ./tools)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  build:
    name: Dashboard + binary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: kine/web-app/package-lock.json

      - name: Install dashboard deps
        working-directory: kine/web-app
        run: npm ci

      - name: Typecheck dashboard
        working-directory: kine/web-app
        run: npx tsc --noEmit

      - name: Build dashboard
        working-directory: kine/web-app
        run: npm run build

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: kine/go.sum

      - name: Build binary with embedded dashboard
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/kinerouter ./cmd/kinerouter

      - name: Build tray (stub on Linux, no GTK needed)
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/kinerouter-tray ./cmd/kinerouter-tray

      - name: Smoke test
        run: |
          DATA_DIR="$(mktemp -d)" PORT=20128 /tmp/kinerouter &
          pid=$!
          for _ in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:20128/api/health >/dev/null 2>&1; then break; fi
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:20128/api/health
          curl -fsS http://127.0.0.1:20128/ | head -c 200
          kill "$pid"
