name: KineRouter npm publish

# Manual only: publishing is irreversible for a given version, and the tarball
# is only useful after the matching kine-vX.Y.Z release (binaries +
# checksums.txt) is live — the package's postinstall downloads from it.
#
# Requires an NPM_TOKEN repo secret with publish rights on the `kinerouter`
# package. The version is stamped into npm/package.json from the tag so the
# shim looks for the exact asset names the release workflow produced.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing kine-vX.Y.Z tag whose release is published"
        required: true
        type: string
      dry_run:
        description: "npm publish --dry-run (no upload)"
        required: false
        default: true
        type: boolean

concurrency:
  group: kine-npm-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Stamp version from tag and verify release assets
        working-directory: npm
        env:
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          version="${TAG#kine-v}"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "'$TAG' is not kine-vX.Y.Z"; exit 1 ;;
          esac

          base="https://github.com/$REPO/releases/download/$TAG"
          code=$(curl -sSL -o checksums.txt -w '%{http_code}' "$base/checksums.txt")
          [ "$code" = 200 ] || { echo "checksums.txt -> HTTP $code"; exit 1; }
          rm -f checksums.txt

          for asset in \
            "kinerouter_${version}_linux_amd64" \
            "kinerouter_${version}_linux_arm64" \
            "kinerouter_${version}_darwin_amd64" \
            "kinerouter_${version}_darwin_arm64" \
            "kinerouter_${version}_windows_amd64.exe" \
            "kinerouter_${version}_windows_arm64.exe"; do
            code=$(curl -sSL -o /dev/null -w '%{http_code}' -r 0-0 "$base/$asset")
            case "$code" in
              200|206) echo "$asset ok" ;;
              *) echo "$asset -> HTTP $code"; exit 1 ;;
            esac
          done

          node -e '
            const fs = require("fs");
            const file = "package.json";
            const p = JSON.parse(fs.readFileSync(file, "utf8"));
            p.version = process.argv[1];
            fs.writeFileSync(file, JSON.stringify(p, null, 2) + "\n");
          ' "$version"
          node -p '"publishing " + require("./package.json").version'

      - name: Publish
        working-directory: npm
        run: |
          if [ "$DRY" = "true" ]; then
            npm publish --dry-run --access public
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY: ${{ inputs.dry_run }}
