name: KineRouter Release

# Every release tag in this repo is kine-vX.Y.Z, so every asset glob here is
# kine-*.
#
# Publishing creates: a GitHub Release with cross-compiled binaries, and a
# multi-arch image on GHCR. internal/gateway/version.go's update check reads
# this release, which is what the dashboard's "Update now" button offers.

on:
  push:
    tags:
      - "kine-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing kine-vX.Y.Z tag to publish"
        required: true
        type: string

concurrency:
  group: kine-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GO_VERSION: "1.27.4"
  NODE_VERSION: "24"
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/kinerouter

jobs:
  test:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: kine
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: kine/go.sum
      - run: go vet ./...
      - run: go test ./...

  binaries:
    name: Binaries
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: kine/web-app/package-lock.json

      - name: Build dashboard
        working-directory: kine/web-app
        run: npm ci && npm run build

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: kine/go.sum

      - name: Cross-compile
        working-directory: kine
        env:
          VERSION: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          version="${VERSION#kine-v}"
          echo "version=$version" >> "$GITHUB_ENV"
          mkdir -p dist
          rm -f dist/*
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            suffix=""; [ "$os" = windows ] && suffix=".exe"
            out="kinerouter_${version}_${os}_${arch}${suffix}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X github.com/keyzakyy-dev/kinerouter/internal/gateway.Version=$version" \
              -o "dist/$out" ./cmd/kinerouter
            (cd dist && sha256sum "$out" >> checksums.txt)
          done

          # The tray icon is a second binary: a GUI toolkit cannot be linked into
          # the gateway without cgo, which would break the static cross-build.
          # Only Windows is built here (systray is pure Go there, so CGO_ENABLED=0
          # still works); Linux/macOS users build it natively with `-tags tray`.
          for arch in amd64 arm64; do
            out="kinerouter-tray_${version}_windows_${arch}.exe"
            CGO_ENABLED=0 GOOS=windows GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -H=windowsgui" \
              -o "dist/$out" ./cmd/kinerouter-tray
            (cd dist && sha256sum "$out" >> checksums.txt)
          done
          cp LICENSE NOTICE dist/
          cat dist/checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: KineRouter ${{ env.version }}
          generate_release_notes: true
          prerelease: ${{ contains(env.version, '-') }}
          files: |
            kine/dist/kinerouter_*
            kine/dist/kinerouter-tray_*
            kine/dist/checksums.txt
            kine/dist/LICENSE
            kine/dist/NOTICE

  tray:
    name: Tray ${{ matrix.os }}/${{ matrix.arch }}
    needs: binaries
    # cgo + GTK cannot be cross-compiled from one runner, so each platform
    # links natively. Serialised because every job rewrites the release's
    # checksums.txt; parallel writers would drop each other's entries.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { os: ubuntu-latest, goos: linux, arch: amd64 }
          - { os: ubuntu-24.04-arm, goos: linux, arch: arm64 }
          - { os: macos-15-intel, goos: darwin, arch: amd64 }
          - { os: macos-15, goos: darwin, arch: arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: kine/go.sum

      - name: Linux GUI deps
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev

      - name: Build
        working-directory: kine
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
        run: |
          version="${TAG#kine-v}"
          asset="kinerouter-tray_${version}_${GOOS}_${GOARCH}"
          mkdir -p dist
          CGO_ENABLED=1 go build -tags tray -trimpath -ldflags "-s -w" \
            -o "dist/$asset" ./cmd/kinerouter-tray
          echo "asset=$asset" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_ENV"

      # The release and its checksums.txt are created by the binaries job.
      # Append this artifact's hash rather than uploading a fresh file.
      - name: Publish tray and merge checksums
        working-directory: kine
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$tag" --pattern checksums.txt --dir dist --clobber
          sum=$(sha256sum "dist/$asset" | cut -d' ' -f1)
          grep -v "[[:space:]]$asset\$" dist/checksums.txt > dist/checksums.new || true
          echo "$sum  $asset" >> dist/checksums.new
          mv dist/checksums.new dist/checksums.txt
          gh release upload "$tag" "dist/$asset" dist/checksums.txt --clobber

  image:
    name: Image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=match,pattern=kine-v(.*),group=1
            type=match,pattern=kine-v(\d+\.\d+),group=1
            type=raw,value=latest
      - name: Version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: echo "version=${TAG#kine-v}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: ./kine
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  npm:
    name: npm
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      # Stamps the shim to the same version as the binaries and verifies the
      # release assets the postinstall downloads exist, so npm can never point
      # at a version the GitHub Release does not carry.
      - name: Stamp version and verify release assets
        working-directory: npm
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          version="${TAG#kine-v}"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "'$TAG' is not kine-vX.Y.Z"; exit 1 ;;
          esac

          base="https://github.com/$REPO/releases/download/$TAG"
          code=$(curl -sSL -o checksums.txt -w '%{http_code}' "$base/checksums.txt")
          [ "$code" = 200 ] || { echo "checksums.txt -> HTTP $code"; exit 1; }
          rm -f checksums.txt

          for asset in \
            "kinerouter_${version}_linux_amd64" \
            "kinerouter_${version}_linux_arm64" \
            "kinerouter_${version}_darwin_amd64" \
            "kinerouter_${version}_darwin_arm64" \
            "kinerouter_${version}_windows_amd64.exe" \
            "kinerouter_${version}_windows_arm64.exe"; do
            code=$(curl -sSL -o /dev/null -w '%{http_code}' -r 0-0 "$base/$asset")
            case "$code" in
              200|206) echo "$asset ok" ;;
              *) echo "$asset -> HTTP $code"; exit 1 ;;
            esac
          done

          node -e '
            const fs = require("fs");
            const file = "package.json";
            const p = JSON.parse(fs.readFileSync(file, "utf8"));
            p.version = process.argv[1];
            fs.writeFileSync(file, JSON.stringify(p, null, 2) + "\n");
          ' "$version"
          node -p '"publishing " + require("./package.json").version'

      - name: Publish
        working-directory: npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
